version: "3.8"
services:
  api:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://db:5432/app
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
  redis:
    image: redis:7
  worker:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://db:5432/app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
